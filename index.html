<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekti 2</title>
        <!-- Bootstrap styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>PC game deal finder</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for a game...">
            <button id="searchBtn" class="btn">Search</button>
        </div>

        <!-- checkboxi joka löytää pelin tarkalla hakusanallasi -->
            <div class="filter-options">
                <input type="checkbox" id="exactMatchCheck">
                <label for="exactMatchCheck">Exact match only</label>
            </div>

    </header>

    <main>
        <!-- Valittu data esitetään tässä -->
        <div id="resultsContainer" class="results-grid"></div>
        
        <!-- Bootstrapin JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/script.js"></script>
    
    </main>
